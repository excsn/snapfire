[package]
name = "snapfire_svelte"
version = "0.1.0"
description = "Compile Svelte components for snapfirec. No NodeJS required."

keywords = ["svelte", "compiler", "build-tools"]
categories = ["command-line-utilities", "development-tools::build-utils"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/compiler/svelte"
readme = "README.md"

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[[bin]]
name = "snapfirec-svelte"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.14", features = ["loader"] }
snapfire_compiler_wire = { path = "../wire", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
bolero = "0.13"
proptest = "1"
