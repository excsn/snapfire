[package]
name = "snapfire_compiler"
version = "0.10.0"
description = "Compile TypeScript for the browser. No NodeJS required. Fast, native, opinionated."

keywords = ["typescript", "compiler", "swc", "css", "browser"]
categories = ["command-line-utilities", "development-tools::build-utils", "web-programming"]
exclude = ["/tests"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/compiler"
readme = "README.md"

edition = { workspace = true}
authors = { workspace = true}
license = { workspace = true}

[[bin]]
name = "snapfirec"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"

clap = { version = "4.4", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
jsonc-parser = { version = "0.33", features = ["serde"] }

walkdir = "2.5"
globset = "0.4"

lightningcss = { version = "1.0.0-alpha.72", features = ["browserslist", "sourcemap"] }
browserslist-rs = "0.20.0"
parcel_sourcemap = { version = "2.1", features = ["json"] }
base64 = "0.23"
notify = "8"
rayon = "1.12.0"

[dependencies.swc_core]
version = "50"
features = [
  "common",
  "common_sourcemap",
  "ecma_ast",
  "ecma_parser",
  "ecma_codegen",
  "ecma_visit",
  "ecma_transforms_typescript"
]

[features]
minify = ["swc_core/ecma_minifier"]

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
