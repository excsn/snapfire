[package]
name = "snapfire_compiler"
version = "0.18.2"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE"]
description = "Compile TypeScript for the browser. No NodeJS required. Fast, native, opinionated."

keywords = ["typescript", "compiler", "swc", "css", "browser"]
categories = ["command-line-utilities", "development-tools::build-utils", "web-programming"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/compiler"
readme = "README.md"

edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "snapfirec"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
fibre = "0.6"

clap = { version = "4.6", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
snapfire_compiler_wire = { path = "wire", version = "0.5.0" }
jsonc-parser = { version = "0.34", features = ["serde"] }

walkdir = "2.5"
globset = "0.4"

lightningcss = { version = "1.0.0-alpha.72", features = ["browserslist", "sourcemap"] }
browserslist-rs = "0.21"
parcel_sourcemap = { version = "2.1", features = ["json"] }
base64 = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
snapfire_media = { path = "../media", version = "0.3.0" }
snapfire_tailwind = { path = "../tailwind", version = "0.3.0" }
notify = "8"
rayon = "1.12.0"


[dependencies.swc_core]
version = "84"
features = [
  "common",
  "common_sourcemap",
  "ecma_ast",
  "ecma_parser",
  "ecma_codegen",
  "ecma_visit",
  "ecma_transforms_react",
  "ecma_transforms_typescript",
  "typescript"
]

[features]
minify = ["swc_core/ecma_minifier"]

[dev-dependencies]
bolero = "0.13"
proptest = "1"
snapfire_svelte = { path = "svelte" }
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
