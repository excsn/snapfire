[package]
name = "snapfire_compiler_wire"
version = "0.1.0"
description = "The wire contract between snapfirec and a framework compiler plugin."

keywords = ["snapfire", "plugin", "protocol", "build-tools"]
categories = ["development-tools::build-utils"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/compiler/wire"
readme = "README.md"

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
