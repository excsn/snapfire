[package]
name = "snapfire_vue"
version = "0.1.0"
description = "Compile Vue single-file components for snapfirec. No NodeJS required."

keywords = ["vue", "sfc", "compiler", "build-tools"]
categories = ["command-line-utilities", "development-tools::build-utils"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/compiler/vue"
readme = "README.md"

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[[bin]]
name = "snapfirec-vue"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.12", features = ["loader"] }
snapfire_compiler_wire = { path = "../plugin", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
