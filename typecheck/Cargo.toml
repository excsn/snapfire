[package]
name = "snapfire_typecheck"
version = "0.1.0"
description = "Typecheck a TypeScript project against a pinned tsc. No NodeJS required."

keywords = ["typescript", "typecheck", "tsc", "build-tools"]
categories = ["command-line-utilities", "development-tools::build-utils"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/typecheck"
readme = "README.md"

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[[bin]]
name = "snapfiretc"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
