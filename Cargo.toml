[workspace]
resolver = "2"
members = [
  "compiler",
  "fsr/core",
  "fsr/engine",
  "fsr/app",
  "fsr/auth",
  "fsr/cli",
  "fsr/host",
  "fsr/ir",
  "fsr/lower",
  "fsr/payload",
  "fsr/plan",
  "fsr/sites",
  "fsr/runtime",
  "fsr/service",
  "fsr/session",
  "fsr/tera",
  "web",
  "web/examples/basic_site",
  "typecheck"
]
exclude = [
  # Their own workspace, so they build the way a consumer's crate would.
  "fsr/examples",
  "www",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
authors = ["Norm O <normo.pub@gmail.com>"]