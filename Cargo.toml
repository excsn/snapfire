[workspace]
resolver = "2"
members = [
  "compiler",
  "web",
  "web/examples/basic_site",
  "typecheck"
]
exclude = [
  # Its own workspace: the published crates version and release together.
  "fsr",
  # Their own workspace, so they build the way a consumer's crate would.
  "fsr/examples",
  "www",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
authors = ["Norm O <normo.pub@gmail.com>"]