[package]
name = "snapfire_i18n"
version = "0.1.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE", "/data/**"]
description = "Currency, percent and relative-time formatting and time zone names from CLDR data and case mapping under a locale, with no dependencies"
keywords = ["snapfire", "i18n", "cldr", "currency", "intl"]
categories = ["internationalization", "localization"]

edition = { workspace = true }
authors = { workspace = true }
license = "MPL-2.0 AND Unicode-3.0"
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/i18n"
readme = "README.md"

[features]
default = ["display_names"]
# The names of languages, regions, scripts, currencies, calendars and date
# fields `Intl.DisplayNames` writes, about 5.9 MB of CLDR data.
display_names = []

[dependencies]

[dev-dependencies]
snapfire_time = { path = "../time" }
