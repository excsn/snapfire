[package]
name = "snapfire_fsr_session"
version = "0.14.1"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE"]
description = "Sessions for SnapFire FSR: signed cookies, the session store and CSRF."
keywords = ["snapfire", "fsr", "session", "cookie", "csrf"]
categories = ["web-programming", "authentication"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_payload.workspace = true
aes-gcm = "0.11"
base64 = "0.23"
serde_json.workspace = true
fibre_cache.workspace = true
futures-util = "0.3"
parking_lot = "0.13"
hmac = "0.13"
rand = "0.9"
sha2 = "0.11"

[dev-dependencies]
proptest = "1"
futures = "0.3"
