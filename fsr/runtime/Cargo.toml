[package]
name = "snapfire_fsr_runtime"
version = "0.6.2"
description = "Request blocks for SnapFire FSR: matching, resolution, data sources, evaluation and assembly."
keywords = ["snapfire", "fsr", "ssr", "streaming", "cache"]
categories = ["web-programming::http-server"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_payload.workspace = true
futures-util = "0.3"
fibre_cache = "0.4"
indexmap = "2"
matchit = "0.8"
parking_lot = "0.12"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
futures = "0.3"
snapfire_fsr_macros.workspace = true
