[package]
name = "snapfire_fsr_runtime"
version = "0.15.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE"]
description = "Request blocks for SnapFire FSR: matching, resolution, data sources, evaluation and assembly."
keywords = ["snapfire", "fsr", "ssr", "streaming", "cache"]
categories = ["web-programming::http-server"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_payload.workspace = true
form_urlencoded = "1"
futures-util = "0.3"
futures-channel = "0.3"
fibre_cache.workspace = true
indexmap.workspace = true
matchit = "0.9"
parking_lot = "0.13"
serde_json.workspace = true
thiserror = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
futures = "0.3"
snapfire_fsr_macros.workspace = true
