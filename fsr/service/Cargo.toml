[package]
name = "snapfire_fsr_service"
version = "0.1.0"
description = "The typed service boundary for Snapfire FSR: the contract artifact, the registry and transports."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr_core = { path = "../core" }
snapfire_fsr_payload = { path = "../payload" }
snapfire_fsr_runtime = { path = "../runtime" }
snapfire_fsr_session = { path = "../session" }
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
