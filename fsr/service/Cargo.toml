[package]
name = "snapfire_fsr_service"
version = "0.5.0"
description = "The typed service boundary for SnapFire FSR: the contract artifact, the registry and transports."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr_core = { path = "../core" }
snapfire_fsr_payload = { path = "../payload" }
snapfire_fsr_runtime = { path = "../runtime" }
snapfire_fsr_session = { path = "../session" }
fibre_cache = { version = "0.4", features = ["tokio"] }
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
protox = { version = "0.9", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

[features]
default = []
grpc = ["dep:protox", "dep:prost", "dep:prost-types", "dep:prost-reflect", "dep:tonic", "dep:bytes", "dep:http"]
