[package]
name = "snapfire_fsr_service"
version = "0.15.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/proto/**", "/LICENSE"]
description = "The typed service boundary for SnapFire FSR: the contract artifact, the registry and transports."
keywords = ["snapfire", "fsr", "openapi", "grpc", "contract"]
categories = ["web-programming::http-client", "api-bindings"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_session.workspace = true
fibre_cache.workspace = true
futures-util = "0.3"
indexmap.workspace = true
parking_lot = "0.13"
fibre_http = { version = "0.5.2", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tracing = "0.1"
protox = { version = "0.9", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"], optional = true }
base64 = { version = "0.23", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
apollo-compiler = { version = "1", optional = true }

[dev-dependencies]
snapfire_fsr_macros.workspace = true
proptest = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
fibre_tracing = "0.6"
tracing-subscriber = "0.3"

[features]
default = []
grpc = ["dep:protox", "dep:prost", "dep:prost-types", "dep:prost-reflect", "dep:tonic", "dep:bytes", "dep:http", "dep:base64", "dep:rustls"]
graphql = ["dep:apollo-compiler", "dep:fibre_http"]
http = ["dep:fibre_http", "dep:http"]
