[package]
name = "snapfire_fsr_cli"
version.workspace = true
description = "fsr: discovers an application's routes, lowers its loaders and actions and emits the plan file."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[[bin]]
name = "fsr"
path = "src/main.rs"

[features]
default = []
tls = ["snapfire_fsr_host/tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1.1.10"
ctrlc = { version = "3", features = ["termination"] }
futures-util = "0.3"
parking_lot = "0.12"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snapfire_fsr_core.workspace = true
snapfire_fsr_engine.workspace = true
snapfire_fsr_host.workspace = true

snapfire_fsr_sites.workspace = true
snapfire_fsr_ir.workspace = true
snapfire_fsr_lower.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_plan.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_service = { workspace = true, features = ["grpc"] }
tar = "0.4.46"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
toml = "0.8"
