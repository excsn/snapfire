[package]
name = "snapfire_fsr_cli"
version = "0.20.0"
description = "fsr: discovers an application's routes, lowers its loaders and actions and emits the plan file."
keywords = ["snapfire", "fsr", "build-tool", "typescript", "cli"]
categories = ["web-programming", "development-tools::build-utils", "command-line-utilities"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[[bin]]
name = "fsr"
path = "src/main.rs"

[features]
default = ["tera", "mdx-highlight", "mdx-frontmatter"]
tls = ["snapfire_fsr_host/tls"]
# A `page.tera` or `layout.tera` under `routes/`, served by the stock host.
tera = ["snapfire_fsr_host/tera"]
# `.mdx` and `.md` routes and imports, read at build time.
mdx = ["dep:snapfire_fsr_mdx"]
# Fenced code in MDX highlighted at build time.
mdx-highlight = ["mdx", "snapfire_fsr_mdx/highlight"]
# YAML or TOML frontmatter in MDX and markdown as `export const meta`.
mdx-frontmatter = ["mdx", "snapfire_fsr_mdx/frontmatter"]

[dependencies]
clap = { version = "4", features = ["derive"] }
fibre = "0.6"
syn = { version = "2", features = ["full"] }
quote = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1.1.10"
ctrlc = { version = "3", features = ["termination"] }
futures-util = "0.3"
parking_lot = "0.12"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
snapfire_fsr.workspace = true
snapfire_fsr_assets.workspace = true
snapfire_fsr_core.workspace = true
snapfire_fsr_engine.workspace = true
snapfire_fsr_host.workspace = true

snapfire_fsr_sites = { workspace = true, features = ["http"] }
snapfire_fsr_ir.workspace = true
snapfire_fsr_lower.workspace = true
snapfire_fsr_mdx = { workspace = true, optional = true }
snapfire_fsr_ogimage.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_plan.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_service = { workspace = true, features = ["grpc"] }
snapfire_compiler_wire = { path = "../../compiler/wire", version = "0.3.0" }
snapfire_tailwind = { path = "../../tailwind", version = "0.3.0" }
tar = "0.4.46"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net"] }
toml = "0.8"

[dev-dependencies]
bolero = "0.13"
bytes = "1"
http = "1"
http-body-util = "0.1"
proptest = "1"

[[test]]
name = "mdx"
required-features = ["mdx-highlight", "mdx-frontmatter"]
