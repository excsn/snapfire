[package]
name = "snapfire_fsr_cli"
version = "0.1.0"
description = "fsr: discovers an application's routes, lowers its loaders and actions and emits the plan file."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[[bin]]
name = "fsr"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1.1.10"
ctrlc = { version = "3", features = ["termination"] }
futures-executor = "0.3"
futures-util = "0.3"
parking_lot = "0.12"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snapfire_fsr_core = { path = "../core" }
snapfire_fsr_engine = { path = "../engine" }
snapfire_fsr_ir = { path = "../ir" }
snapfire_fsr_lower = { path = "../lower" }
snapfire_fsr_payload = { path = "../payload" }
snapfire_fsr_plan = { path = "../plan" }
snapfire_fsr_runtime = { path = "../runtime" }
snapfire_fsr_service = { path = "../service", features = ["grpc"] }
tar = "0.4.46"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
toml = "0.8"
