[package]
name = "snapfire_fsr_cli"
version = "0.24.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/embedded/**", "/templates/**"]
description = "fsr, the CLI for a SnapFire FSR application: scaffolds, runs in development, tests, lints, builds the plan file and writes the deploy tree."
keywords = ["snapfire", "fsr", "build-tool", "typescript", "cli"]
categories = ["web-programming", "development-tools::build-utils", "command-line-utilities"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[[bin]]
name = "fsr"
path = "src/main.rs"

[features]
default = ["test", "web", "tera", "mdx-highlight", "mdx-frontmatter", "grpc", "graphql", "http", "share_cards"]
# `fsr test` and the QuickJS engine it runs specs in. Off, the binary links no
# JavaScript engine, which is the build to serve a deployment with.
test = ["web", "dep:snapfire_fsr_engine"]
# The web half: `prerender`, `bundle`, `sites`, `census`, `use`, `add`, `types`
# and `fonts`. Off, the CLI builds and serves an app but carries none of these,
# which a terminal app does not need.
web = []
tls = ["snapfire_fsr_host/tls"]
# Card images drawn by the stock host.
share_cards = ["snapfire_fsr_host/share_cards"]
# `clients/<name>.proto` contracts, imported at build and called over gRPC.
grpc = ["snapfire_fsr_service/grpc", "snapfire_fsr_host/grpc"]
# `clients/<name>.graphql` contracts.
graphql = ["snapfire_fsr_service/graphql", "snapfire_fsr_host/graphql"]
# An OpenAPI contract called over HTTP by `fsr dev` and `fsr serve`.
http = ["snapfire_fsr_service/http", "snapfire_fsr_host/http"]
# Serves the browser client's source maps, its TypeScript inlined.
client-source-maps = ["snapfire_fsr_host/client_source_maps"]
# A `page.tera` or `layout.tera` under `routes/`, served by the stock host.
tera = ["snapfire_fsr_host/tera"]
# `.mdx` and `.md` routes and imports, read at build time.
mdx = ["dep:snapfire_fsr_mdx"]
# Fenced code in MDX highlighted at build time.
mdx-highlight = ["mdx", "snapfire_fsr_mdx/highlight"]
# YAML or TOML frontmatter in MDX and markdown as `export const meta`.
mdx-frontmatter = ["mdx", "snapfire_fsr_mdx/frontmatter"]
# `fsr dev --desktop` and `fsr serve --desktop`: the app in a native window over the system webview.
# `fsr dev --terminal`: the root page drawn in the terminal with Ink's elements.
terminal = ["dep:crossterm", "dep:snapfire_fsr_terminal"]
desktop = ["web", "dep:bytes", "dep:http", "dep:http-body-util", "dep:muda", "dep:open", "dep:rfd", "dep:tao", "dep:wry"]

[dependencies]
clap = { version = "4", features = ["derive"] }
fibre = "0.6"
syn = { version = "2", features = ["full"] }
quote = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1.1.10"
ctrlc = { version = "3", features = ["termination"] }
futures-util = "0.3"
parking_lot = "0.12"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
snapfire_fsr.workspace = true
snapfire_fsr_assets.workspace = true
snapfire_fsr_core.workspace = true
snapfire_fsr_engine = { workspace = true, optional = true }
snapfire_fsr_host = { workspace = true, features = ["auth", "oidc", "passkey"] }

snapfire_fsr_sites = { workspace = true, features = ["http"] }
snapfire_fsr_ir.workspace = true
snapfire_fsr_lower.workspace = true
snapfire_fsr_migrate.workspace = true
snapfire_fsr_mdx = { workspace = true, optional = true }
snapfire_fsr_payload.workspace = true
snapfire_fsr_plan.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_service.workspace = true
snapfire_compiler_wire = { path = "../../compiler/wire", version = "0.5.0" }
snapfire_lint = { path = "../../lint", version = "0.1.0" }
snapfire_fsr_lint.workspace = true
snapfire_tailwind = { path = "../../tailwind", version = "0.3.0" }
tar = "0.4.46"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net"] }
bytes = { version = "1", optional = true }
crossterm = { version = "0.29", optional = true }
snapfire_fsr_terminal = { workspace = true, optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
muda = { version = "0.21", optional = true }
open = { version = "5", optional = true }
rfd = { version = "0.17", optional = true }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
toml = "0.8"

[dependencies.swc_core]
version = "82"
features = ["common", "ecma_ast", "ecma_parser", "ecma_visit"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
bolero = "0.13"
bytes = "1"
http = "1"
http-body-util = "0.1"
proptest = "1"

[[test]]
name = "mdx"
required-features = ["mdx-highlight", "mdx-frontmatter"]

[[test]]
name = "import_layout"
required-features = ["test"]

[[test]]
name = "desktop"
required-features = ["desktop"]

[[test]]
name = "terminal"
required-features = ["terminal"]

[[test]]
name = "terminal_finally"
required-features = ["terminal"]

[[test]]
name = "terminal_examples"
required-features = ["terminal"]

[[test]]
name = "terminal_run"
required-features = ["terminal"]

[[test]]
name = "terminal_build"
required-features = ["terminal"]

[[test]]
name = "bundle"
required-features = ["web"]

[[test]]
name = "census"
required-features = ["web"]

[[test]]
name = "test_command"
required-features = ["test"]

[[test]]
name = "examples"
required-features = ["test"]

[[test]]
name = "public"
required-features = ["web"]

[[test]]
name = "store_crosscheck"
required-features = ["test"]

[[test]]
name = "runner"
required-features = ["test"]

[[test]]
name = "sites"
required-features = ["web"]
