[package]
name = "snapfire_fsr_payload"
version = "0.6.1"
description = "Payload encodings for SnapFire FSR: the JSON pair and the HTML serializer."
keywords = ["snapfire", "fsr", "serialization", "streaming", "wire"]
categories = ["web-programming", "encoding"]
exclude = ["tests", "benches"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
base64 = "0.22"

[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }
bolero = "0.13"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "encode"
harness = false
