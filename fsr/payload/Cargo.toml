[package]
name = "snapfire_fsr_payload"
version = "0.11.1"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE"]
description = "Payload encodings for SnapFire FSR: the JSON pair and the HTML serializer."
keywords = ["snapfire", "fsr", "serialization", "streaming", "wire"]
categories = ["web-programming", "encoding"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
serde_json.workspace = true
base64 = "0.23"

[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }
bolero = "0.13"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "encode"
harness = false
