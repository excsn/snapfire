[package]
name = "snapfire_fsr_tera"
version = "0.13.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md"]
description = "Tera evaluator for SnapFire FSR: string rendering with marker-and-split islands and slots."
keywords = ["snapfire", "fsr", "tera", "template", "ssr"]
categories = ["web-programming", "template-engine"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_runtime.workspace = true
tera = { version = "2", features = ["fast", "preserve_order"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
futures = "0.3"
