[package]
name = "snapfire_fsr_tera"
version = "0.5.0"
description = "Tera evaluator for SnapFire FSR: string rendering with marker-and-split islands and slots."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr_core = { path = "../core" }
snapfire_fsr_payload = { path = "../payload" }
snapfire_fsr_runtime = { path = "../runtime" }
tera = { version = "2", features = ["fast"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
futures = "0.3"
