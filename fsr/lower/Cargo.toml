[package]
name = "snapfire_fsr_lower"
version = "0.22.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/terminal/**", "/LICENSE"]
description = "The recogniser for SnapFire FSR: reads a TypeScript loader or actions module and lowers each body to the IR, naming the line that stops it."
keywords = ["snapfire", "fsr", "typescript", "parser", "lowering"]
categories = ["web-programming", "compilers"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_ir.workspace = true
snapfire_fsr_service.workspace = true
snapfire_compiler_wire = { path = "../../compiler/wire", version = "0.5.0" }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_diagnostics = "0.155"
oxc_parser = "0.155"
oxc_semantic = "0.155"
oxc_span = "0.155"
oxc_str = "0.155"
oxc_syntax = "0.155"

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
parking_lot = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "std"] }
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
futures = "0.3"
snapfire_vue = { path = "../../compiler/vue" }
snapfire_svelte = { path = "../../compiler/svelte" }
proptest = "1"
snapfire_fsr_mdx = { workspace = true, features = ["highlight", "frontmatter"] }
oxc_codegen = "0.155"
oxc_transformer = "0.155"
