[package]
name = "snapfire_fsr_lower"
version = "0.14.0"
description = "The recogniser for SnapFire FSR: reads a TypeScript loader or actions module and lowers each body to the IR, naming the line that stops it."
keywords = ["snapfire", "fsr", "typescript", "parser", "lowering"]
categories = ["web-programming", "compilers"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_ir.workspace = true
snapfire_fsr_service.workspace = true
snapfire_compiler_wire = { path = "../../compiler/wire", version = "0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dependencies.swc_core]
version = "77"
features = ["common", "ecma_ast", "ecma_parser"]

[dev-dependencies]
snapfire_fsr_core.workspace = true
snapfire_vue = { path = "../../compiler/vue" }

[dev-dependencies.swc_core]
version = "77"
features = ["common", "ecma_ast", "ecma_parser", "ecma_codegen", "ecma_visit", "ecma_transforms_typescript"]
