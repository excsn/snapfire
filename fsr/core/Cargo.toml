[package]
name = "snapfire_fsr_core"
version.workspace = true
description = "Vocabulary types for SnapFire FSR: the payload tree, the render plan and the value model."
keywords = ["snapfire", "fsr", "payload", "render", "value"]
categories = ["web-programming", "data-structures"]
exclude = ["tests", "benches"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
indexmap = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "fingerprint"
harness = false
