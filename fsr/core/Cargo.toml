[package]
name = "snapfire_fsr_core"
version = "0.10.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md"]
description = "Vocabulary types for SnapFire FSR: the payload tree, the render plan, the value model and the extension contract."
keywords = ["snapfire", "fsr", "payload", "render", "value"]
categories = ["web-programming", "data-structures"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
foldhash = "0.2"
parking_lot = "0.13"
hashbrown = { version = "0.17", default-features = false }
indexmap = "2"
serde = "1"
stacker = "0.1"
smol_str = { version = "0.3", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
serde = { version = "1", features = ["derive"] }
proptest = "1"
criterion = "0.5"

[[bench]]
name = "fingerprint"
harness = false
