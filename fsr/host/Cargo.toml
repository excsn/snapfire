[package]
name = "snapfire_fsr_host"
version = "0.6.0"
description = "The stock host for SnapFire FSR: an app.toml, a plan file and a contract become a tower service over http types, served by hyper or mounted anywhere."
keywords = ["snapfire", "fsr", "http-server", "ssr", "tower"]
categories = ["web-programming::http-server"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[features]
default = []
actix = ["dep:actix-web"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:tokio-rustls"]
ws = ["dep:tokio-tungstenite"]
# `POST /__fsr/sites/reload`, an administrative route the host does not guard.
sites_reload = []

[dependencies]
fibre = "0.6"
fibre_logging = "0.5.7"
fibre_tracing = "0.5"
tracing-subscriber = { version = "0.3", features = ["registry", "std"] }
parking_lot = "0.12"
snapfire_fsr.workspace = true
snapfire_fsr_ir.workspace = true
snapfire_fsr_auth.workspace = true
snapfire_fsr_core.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_plan.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_service = { workspace = true, features = ["grpc"] }
snapfire_fsr_session.workspace = true
bytes = "1"
c5store = { version = "^0", features = ["toml"] }
form_urlencoded = "1"
log = "0.4"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros", "signal", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
actix-web = { version = "4", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
axum = "0.8"
futures = "0.3"
hyper = { version = "1", features = ["client", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
