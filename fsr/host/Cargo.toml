[package]
name = "snapfire_fsr_host"
version = "0.25.1"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/embedded/**", "/LICENSE"]
description = "The stock host for SnapFire FSR: an app.toml, a plan file and a contract become a tower service over http types, served by hyper or mounted anywhere."
keywords = ["snapfire", "fsr", "http-server", "ssr", "tower"]
categories = ["web-programming::http-server"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[features]
default = ["client_readable", "tz_compiled"]
# The IANA time zone database compiled into the binary, about 240 KiB, which
# `Date`'s local time reads. Every host answers the same, slim containers
# included. Either source may be on, or both, with `[time] zones` choosing.
tz_compiled = ["snapfire_fsr_ir/tz_compiled", "snapfire_time/tz_compiled"]
# The host's own zoneinfo under `/usr/share/zoneinfo`, read when a zone is
# first used.
tz_system = ["snapfire_fsr_ir/tz_system", "snapfire_time/tz_system"]
# The readable client build, beside the minified one the binary always carries.
# Off, the binary is about 215 KiB smaller and serves minified whatever
# `document.client` says.
client_readable = []
# Each client module's source map, with its TypeScript inlined, served beside it
# under `/static/js/fsr`. Off, the modules are served without their
# `sourceMappingURL` comment.
client_source_maps = []
actix = ["dep:actix-web", "dep:actix-ws"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:tokio-rustls"]
ws = ["dep:tokio-tungstenite"]
# Sign-in: the `/auth/` routes, the `file` and `service` methods, several methods
# on one page, a second factor and token refresh at the outbound call. Off, an
# `[auth]` section is refused at boot naming the feature.
auth = ["dep:snapfire_fsr_auth"]
# An `oidc` sign-in method against an OpenID Connect issuer.
oidc = ["auth", "dep:snapfire_fsr_oidc"]
# A `passkey` sign-in method, WebAuthn over a credential store.
passkey = ["auth", "dep:snapfire_fsr_passkey"]
# `POST /__fsr/sites/reload`, an administrative route the host does not guard.
sites_reload = []
# A `.tera` route or layout under the app, rendered by the Tera evaluator.
tera = ["dep:snapfire_fsr_tera", "dep:tera"]
# Card images, `opengraph-image.tsx` and its kin, drawn on request.
share_cards = ["dep:snapfire_fsr_ogimage"]
# A `clients/<name>.proto` contract, called over gRPC.
grpc = ["snapfire_fsr_service/grpc"]
# A `clients/<name>.graphql` contract.
graphql = ["snapfire_fsr_service/graphql"]
# An OpenAPI contract called over HTTP. A mocked one needs no feature.
http = ["snapfire_fsr_service/http"]

[dependencies]
fibre = "0.6"
fibre_logging = "0.5.7"
fibre_tracing = "0.6"
tracing-subscriber = { version = "0.3", features = ["registry", "std", "fmt"] }
parking_lot = "0.13"
snapfire_fsr.workspace = true
snapfire_fsr_ir.workspace = true
snapfire_time = { path = "../../time", version = "0.1.0", default-features = false }
snapfire_fsr_auth = { workspace = true, optional = true }
snapfire_fsr_oidc = { workspace = true, optional = true }
snapfire_fsr_passkey = { workspace = true, optional = true }
snapfire_fsr_core.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_tera = { workspace = true, optional = true }
tera = { version = "2", features = ["fast", "preserve_order"], optional = true }
snapfire_fsr_plan.workspace = true
snapfire_fsr_ogimage = { workspace = true, optional = true }
snapfire_fsr_runtime.workspace = true
snapfire_fsr_service.workspace = true
snapfire_fsr_session.workspace = true
snapfire_compiler_wire = { path = "../../compiler/wire", version = "0.5.0" }
snapfire_sitemap = { path = "../../sitemap", version = "0.2.0" }
bytes = "1"
c5store = { version = "^0", features = ["toml"] }
ecies_25519 = "^0"
form_urlencoded = "1"
percent-encoding = "2"
log = "0.4"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
matchit = "0.9"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
serde.workspace = true
schemars = "1"
sha2 = "0.11"
base64 = "0.23"
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros", "signal", "sync", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
actix-web = { version = "4", optional = true }
actix-ws = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"], optional = true }
multer = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
snapfire_fsr_service = { workspace = true, features = ["grpc", "graphql", "http"] }
actix-web = "4"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
snapfire_fsr_test_internal = { path = "../test_internal" }
# The tests sign in, so they build the host with every sign-in method.
snapfire_fsr_host = { path = ".", features = ["auth", "oidc", "passkey", "share_cards", "http"] }
snapfire_fsr_macros.workspace = true
jsonschema = { version = "0", default-features = false }
proptest = "1"
bolero = "0.13"
axum = "0.8"
futures = "0.3"
hyper = { version = "1", features = ["client", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
