[package]
name = "snapfire_fsr"
version = "0.1.0"
description = "The Snapfire FSR application host: binds a plan file to the implementations that answer it."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr_core = { path = "../core" }
snapfire_fsr_payload = { path = "../payload" }
snapfire_fsr_plan = { path = "../plan" }
snapfire_fsr_runtime = { path = "../runtime" }
snapfire_fsr_service = { path = "../service" }
snapfire_fsr_session = { path = "../session" }
thiserror = "2"

[dev-dependencies]
futures = "0.3"
futures-util = "0.3"
