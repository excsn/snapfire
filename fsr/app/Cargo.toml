[package]
name = "snapfire_fsr"
version = "0.7.2"
description = "The SnapFire FSR application host: binds a plan file to the implementations that answer it."
keywords = ["snapfire", "fsr", "fullstack", "routing", "ssr"]
categories = ["web-programming::http-server"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_ir.workspace = true
snapfire_fsr_payload.workspace = true
snapfire_fsr_plan.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_service.workspace = true
snapfire_fsr_session.workspace = true
futures-util = "0.3"
thiserror = "2"

[dev-dependencies]
futures = "0.3"
futures-util = "0.3"
