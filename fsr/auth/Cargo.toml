[package]
name = "snapfire_fsr_auth"
version.workspace = true
description = "Auth for SnapFire FSR: the IdentityProvider seam, flow state and the dev provider."
keywords = ["snapfire", "fsr", "authentication", "identity", "oidc"]
categories = ["web-programming", "authentication"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_fsr_session.workspace = true
form_urlencoded = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
futures = "0.3"
