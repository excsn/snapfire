[package]
name = "snapfire_fsr_passkey"
version = "0.2.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md"]
description = "Passkey sign-in for SnapFire FSR: WebAuthn as an IdentityProvider, with a credential store seam."
keywords = ["snapfire", "fsr", "passkey", "webauthn", "authentication"]
categories = ["web-programming", "authentication"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_auth.workspace = true
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
base64 = "0.23"
ciborium = "0.2"
futures-util = "0.3"
parking_lot = "0.13"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
futures = "0.3"
proptest = "1"
