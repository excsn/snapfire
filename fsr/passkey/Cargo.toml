[package]
name = "snapfire_fsr_passkey"
version = "0.1.0"
description = "Passkey sign-in for SnapFire FSR: WebAuthn as an IdentityProvider, with a credential store seam."
keywords = ["snapfire", "fsr", "passkey", "webauthn", "authentication"]
categories = ["web-programming", "authentication"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_auth.workspace = true
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
base64 = "0.22"
ciborium = "0.2"
futures-util = "0.3"
parking_lot = "0.12"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures = "0.3"
proptest = "1"
