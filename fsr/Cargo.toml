[workspace]
resolver = "2"
members = [
  "core",
  "engine",
  "app",
  "auth",
  "cli",
  "host",
  "ir",
  "lower",
  "macros",
  "payload",
  "plan",
  "sites",
  "runtime",
  "service",
  "session",
  "tera",
]
exclude = [
  # Their own workspace, so they build the way a consumer's crate would.
  "examples",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
authors = ["Norm O <normo.pub@gmail.com>"]
homepage = "https://github.com/excsn/snapfire"
repository = "https://github.com/excsn/snapfire"

# Each crate carries its own version; a release moves only the crates that
# changed and the requirements here that name them.
[workspace.dependencies]
snapfire_fsr = { path = "app", version = "0.7.2" }
snapfire_fsr_auth = { path = "auth", version = "0.6.0" }
snapfire_fsr_cli = { path = "cli", version = "0.9.1" }
snapfire_fsr_core = { path = "core", version = "0.6.1" }
snapfire_fsr_engine = { path = "engine", version = "0.5.1" }
snapfire_fsr_host = { path = "host", version = "0.9.0" }
snapfire_fsr_ir = { path = "ir", version = "0.8.0" }
snapfire_fsr_lower = { path = "lower", version = "0.8.0" }
snapfire_fsr_macros = { path = "macros", version = "0.5.0" }
snapfire_fsr_payload = { path = "payload", version = "0.6.1" }
snapfire_fsr_plan = { path = "plan", version = "0.7.3" }
snapfire_fsr_runtime = { path = "runtime", version = "0.6.2" }
snapfire_fsr_service = { path = "service", version = "0.6.1" }
snapfire_fsr_session = { path = "session", version = "0.6.1" }
snapfire_fsr_sites = { path = "sites", version = "0.8.2" }
snapfire_fsr_tera = { path = "tera", version = "0.6.1" }
