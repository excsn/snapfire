[workspace]
resolver = "2"
members = [
  "core",
  "engine",
  "app",
  "assets",
  "auth",
  "cli",
  "host",
  "ir",
  "lint",
  "lower",
  "mdx",
  "migrate",
  "oidc",
  "passkey",
  "macros",
  "ogimage",
  "payload",
  "plan",
  "sites",
  "runtime",
  "service",
  "session",
  "tera",
  "terminal",
  "test_internal",
]
exclude = [
  # Their own workspace, so they build the way a consumer's crate would.
  "examples",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
authors = ["Norm O <normo.pub@gmail.com>"]
homepage = "https://github.com/excsn/snapfire"
repository = "https://github.com/excsn/snapfire"

# Each crate carries its own version; a release moves only the crates that
# changed and the requirements here that name them.
[workspace.dependencies]
fibre_cache = { version = "0.4", features = ["tokio"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
snapfire_fsr = { path = "app", version = "0.21.0" }
snapfire_fsr_assets = { path = "assets", version = "0.3.1" }
snapfire_fsr_auth = { path = "auth", version = "0.14.0" }
snapfire_fsr_cli = { path = "cli", version = "0.25.0" }
snapfire_fsr_core = { path = "core", version = "0.10.1" }
snapfire_fsr_engine = { path = "engine", version = "0.6.3" }
snapfire_fsr_host = { path = "host", version = "0.25.0" }
snapfire_fsr_ir = { path = "ir", version = "0.21.0" }
snapfire_fsr_lower = { path = "lower", version = "0.23.0" }
snapfire_fsr_ogimage = { path = "ogimage", version = "0.2.2" }
snapfire_fsr_mdx = { path = "mdx", version = "0.2.3" }
snapfire_fsr_oidc = { path = "oidc", version = "0.3.0" }
snapfire_fsr_passkey = { path = "passkey", version = "0.3.0" }
snapfire_fsr_macros = { path = "macros", version = "0.8.1" }
snapfire_fsr_lint = { path = "lint", version = "0.1.1" }
snapfire_fsr_migrate = { path = "migrate", version = "0.2.3" }
snapfire_fsr_payload = { path = "payload", version = "0.11.1" }
snapfire_fsr_plan = { path = "plan", version = "0.20.0" }
snapfire_fsr_runtime = { path = "runtime", version = "0.15.0" }
snapfire_fsr_service = { path = "service", version = "0.15.0" }
snapfire_fsr_session = { path = "session", version = "0.14.0" }
snapfire_fsr_sites = { path = "sites", version = "0.21.0" }
snapfire_fsr_tera = { path = "tera", version = "0.14.0" }
snapfire_fsr_terminal = { path = "terminal", version = "0.2.1" }
