[package]
name = "snapfire_fsr_engine"
version = "0.6.4"
include = ["/src/**/*.rs", "/src/**/*.js", "/Cargo.toml", "/README.md", "/LICENSE"]
description = "QuickJS in process for fsr test: a DOM, React and an application's pages, with actions answered by the interpreter."
keywords = ["snapfire", "fsr", "quickjs", "testing", "dom"]
categories = ["web-programming", "development-tools::testing"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
fibre = "0.6"
futures-util = "0.3"
parking_lot = "0.13"
rquickjs = { version = "0.14", features = ["loader"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
proptest = "1"
snapfire_fsr_core.workspace = true
snapfire_fsr_ir = { workspace = true, features = ["intl_compiled"] }
