[package]
name = "snapfire_fsr_engine"
version.workspace = true
description = "QuickJS in process for fsr test: a DOM, React and an application's pages, with actions answered by the interpreter."

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
futures-channel = "0.3"
futures-util = "0.3"
parking_lot = "0.12"
rquickjs = { version = "0.12", features = ["loader"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
