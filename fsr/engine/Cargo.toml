[package]
name = "snapfire_fsr_engine"
version.workspace = true
description = "QuickJS in process for fsr test: a DOM, React and an application's pages, with actions answered by the interpreter."
keywords = ["snapfire", "fsr", "quickjs", "testing", "dom"]
categories = ["web-programming", "development-tools::testing"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
fibre = "0.6"
futures-util = "0.3"
parking_lot = "0.12"
rquickjs = { version = "0.12", features = ["loader"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
