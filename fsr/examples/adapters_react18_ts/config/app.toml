[server]
listen = "127.0.0.1:8210"

[document]
title = "adapters on React 18"

[session]
key = "adapters_react18_ts-development-key-not-a-secret"
ttl = "24h"

[cache]
capacity = 1000
ttl = "1m"

[[static]]
route = "/pictures"
dir = "pictures"

[typecheck]
version = "7.0.2"

[locales]
supported = ["en", "fr"]
default = "en"

[clients.probe]
transport = "mock"
