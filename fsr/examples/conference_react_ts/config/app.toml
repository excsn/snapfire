[app]
dir = "app"

[server]
listen = "127.0.0.1:8150"

[document]
title = "Conference"

[[document.head]]
tag = "link"
rel = "icon"
href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🎤</text></svg>"

[session]
key = "conference-example-dev-key-not-a-secret"
ttl = "12h"

[cache]
capacity = 200
ttl = "5m"

[cache.data]

[clients.program]
transport = "mock"

[typecheck]
version = "7.0.2"
