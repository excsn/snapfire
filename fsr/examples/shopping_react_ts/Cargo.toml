[package]
name = "shopping_react_ts"
version = "0.1.0"
publish = false

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr = { path = "../../app" }
snapfire_fsr_host = { path = "../../host", features = ["actix"] }
snapfire_fsr_core = { path = "../../core" }
snapfire_fsr_plan = { path = "../../plan" }
snapfire_fsr_runtime = { path = "../../runtime" }
snapfire_fsr_service = { path = "../../service" }
actix-web = "4"
fibre_logging = "0.5"
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
futures = "0.3"
futures-util = "0.3"
