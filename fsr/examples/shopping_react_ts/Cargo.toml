[package]
name = "shopping_react_ts"
version = "0.1.0"
publish = false

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr = { path = "../../app" }
snapfire_fsr_host = { path = "../../host", features = ["actix"] }
actix-web = "4"
fibre_logging = "0.5"
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }

[build-dependencies]
snapfire_fsr_cli = { path = "../../cli" }
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
snapfire_fsr_cli = { path = "../../cli" }
snapfire_fsr_core = { path = "../../core" }
snapfire_fsr_engine = { path = "../../engine" }
snapfire_fsr_ir = { path = "../../ir" }
snapfire_fsr_payload = { path = "../../payload" }
snapfire_fsr_plan = { path = "../../plan" }
snapfire_fsr_runtime = { path = "../../runtime" }
snapfire_fsr_service = { path = "../../service", features = ["grpc"] }
criterion = "0.5"
futures = "0.3"
serde_json = "1"

[[bench]]
name = "render"
harness = false
