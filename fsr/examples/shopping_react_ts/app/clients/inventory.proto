syntax = "proto3";

package shop.inventory;

// Warehouse stock, kept by a service that only speaks gRPC.
service Inventory {
  rpc GetStock (StockRequest) returns (StockLevel);
}

message StockRequest {
  int64 product_id = 1;
}

message StockLevel {
  int64 product_id = 1;
  int32 on_hand = 2;
  int32 reserved = 3;
  string warehouse = 4;
  repeated string bins = 5;
}
