[server]
listen = "127.0.0.1:8165"

[document]
title = "Shelf"

# Reported, not enforced. Rename the table to [document.csp] to enforce it.
[document.csp_report_only]
default-src = ["'self'"]
script-src = ["'self'"]
base-uri = ["'none'"]
object-src = ["'none'"]
frame-ancestors = ["'self'"]

[session]
ttl = "24h"

[cache]
capacity = 1000
ttl = "1m"

[typecheck]
version = "7.0.2"
