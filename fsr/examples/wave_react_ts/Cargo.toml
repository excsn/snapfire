[package]
name = "wave_react_ts"
version = "0.1.0"
publish = false

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
async-trait = "0.1"
fibre = "0.6"
parking_lot = "0.12"
plaza = "^0.7"
serde = { version = "1", features = ["derive"] }
snapfire_fsr_core = { path = "../../core" }
snapfire_fsr_host = { path = "../../host", features = ["ws"] }
snapfire_fsr_runtime = { path = "../../runtime" }
snapfire_fsr_service = { path = "../../service" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[build-dependencies]
snapfire_fsr_cli = { path = "../../cli" }

[dev-dependencies]
bytes = "1"
plaza = "^0.7"
futures = "0.3"
http = "1"
http-body-util = "0.1"
