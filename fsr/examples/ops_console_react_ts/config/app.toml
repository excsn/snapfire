[server]
listen = "127.0.0.1:8090"
prerender = "dist/prerender"

[document]
title = "Ops console"

[session]
key = "ops-console-example-dev-key-not-a-secret"
ttl = "1h"
store = "service"
client = "identity"

[cache]
capacity = 500
ttl = "1m"

[cache.data]

[locales]
supported = ["en_US", "fr_FR"]
default = "en_US"
remember = true

[auth]
provider = "service"
client = "identity"
login = "/login"

[clients.fleet]
base_url = "http://127.0.0.1:8091"
bearer = true

[clients.identity]
base_url = "http://127.0.0.1:8092"

[[static]]
route = "/static/js/fsr"
dir = "../../../client/dist"

[typecheck]
version = "7.0.2"
