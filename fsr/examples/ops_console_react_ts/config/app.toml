[server]
listen = "127.0.0.1:8090"

[document]
title = { key = "document.title", default = "Ops console" }
title_template = { key = "document.title_template", default = "{page} · {title}" }

[session]
ttl = "1h"
csrf = "identified"
store = "service"
client = "identity"

[cache]
capacity = 500
ttl = "1m"

[cache.data]

[locales]
supported = ["en_US", "fr_FR"]
default = "en_US"
remember = true

[auth]
provider = "service"
client = "identity"
login = "/login"

[clients.fleet]
base_url = "http://127.0.0.1:8091"
bearer = true

[clients.identity]
base_url = "http://127.0.0.1:8092"

[typecheck]
version = "7.0.2"
