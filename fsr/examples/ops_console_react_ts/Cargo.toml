[package]
name = "ops_console_react_ts"
version = "0.1.0"
publish = false

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
snapfire_fsr = { path = "../../app" }
snapfire_fsr_host = { path = "../../host", features = ["actix"] }
actix-web = "4"
fibre_logging = "0.5"
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
snapfire_fsr_cli = { path = "../../cli" }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
snapfire_fsr_core = { path = "../../core" }
snapfire_fsr_runtime = { path = "../../runtime" }
snapfire_fsr_service = { path = "../../service" }
snapfire_fsr_session = { path = "../../session" }
futures = "0.3"
serde_json = "1"
