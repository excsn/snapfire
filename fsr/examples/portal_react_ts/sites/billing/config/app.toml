[app]
dir = "app"

[server]
listen = "127.0.0.1:8101"

[site]
name = "billing"
at = "/billing"
shell = "../../app/generated/shell.json"
# What the portal renders against a candidate holding this site before it swaps in; a page that fails refuses the reload.
probe = ["/billing", "/billing/invoice/1", { path = "/billing/overdue", as = "probe" }]

[document]
title = "Billing"

[session]
ttl = "1h"

[clients.ledger]
transport = "mock"

[typecheck]
version = "7.0.2"
