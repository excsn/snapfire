[app]
dir = "app"

[server]
listen = "127.0.0.1:8100"

[document]
origin = "http://127.0.0.1:8100"
title = "Acme portal"

[crawl]
robots = "/robots.txt"
sitemap = "/sitemap.xml"

[session]
ttl = "1h"

[auth]
provider = "file"
login = "/login"

[clients.directory]
transport = "mock"

[typecheck]
version = "7.0.2"

[sites]
poll = "5s"
root = "deploy/sites"
store = "http://127.0.0.1:8199"

[sites.billing]
artifact = "billing@1.0.0"

[sites.blog]
artifact = "sites/blog"

[sites.status]
artifact = "status@1.0.0"

# A site in its own process: no artifact here, a prefix and the address of `reports_site_react_ts`.
[sites.reports]
at = "/reports"
over = ["http://127.0.0.1:8104"]
secret = "portal-reports"
