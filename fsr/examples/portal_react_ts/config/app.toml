[app]
dir = "app"

[server]
listen = "127.0.0.1:8100"

[document]
title = "Acme portal"

[session]
key = "portal-example-dev-key-not-a-secret"
ttl = "1h"

[auth]
provider = "file"
login = "/login"

[clients.directory]
transport = "mock"

[typecheck]
version = "7.0.2"

[sites]
poll = "5s"
root = "deploy/sites"
store = "http://127.0.0.1:8199"

[sites.billing]
artifact = "billing@1.0.0"

[sites.blog]
artifact = "sites/blog"

[sites.status]
artifact = "status@1.0.0"
