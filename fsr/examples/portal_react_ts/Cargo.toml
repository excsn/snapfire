[package]
name = "portal_react_ts"
version = "0.1.0"
publish = false

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
futures-util = "0.3"
http = "1"
snapfire_fsr_host = { path = "../../host", features = ["sites_reload", "auth"] }
snapfire_fsr_runtime = { path = "../../runtime" }
snapfire_fsr_sites = { path = "../../sites", features = ["http"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
snapfire_fsr_cli = { path = "../../cli" }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
futures = "0.3"
serde_json = "1"
snapfire_fsr_service = { path = "../../service" }
snapfire_fsr_core = { path = "../../core" }
