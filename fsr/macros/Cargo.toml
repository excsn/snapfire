[package]
name = "snapfire_fsr_macros"
version = "0.8.0"
edition.workspace = true
license.workspace = true
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
description = "Attributes and a derive that let the TypeScript an FSR application runs on the server call Rust: #[native], #[service] and #[derive(Record)]."
keywords = ["snapfire", "fsr", "macro", "derive", "typescript"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
