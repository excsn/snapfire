[package]
name = "snapfire_fsr_mdx"
version = "0.2.1"
description = "MDX and markdown for SnapFire FSR: turns an .mdx or .md file into a TSX module the build lowers, with GFM, heading ids, frontmatter and highlighted code."
keywords = ["snapfire", "fsr", "mdx", "markdown"]
categories = ["web-programming", "parser-implementations"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[features]
default = []
# Code blocks highlighted at build time into classed spans.
highlight = ["dep:syntect", "dep:two-face"]
# YAML or TOML frontmatter turned into `export const meta`.
frontmatter = ["dep:yaml-rust2", "dep:toml"]

[dependencies]
markdown = "1"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
syntect = { version = "5.3", default-features = false, features = ["html", "regex-fancy"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }
yaml-rust2 = { version = "0.13", optional = true }
toml = { version = "0.8", optional = true }

[dependencies.swc_core]
version = "82"
features = ["common", "ecma_ast", "ecma_parser"]
