[package]
name = "snapfire_fsr_sites"
version = "0.21.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md"]
description = "Where a mounted site's artifact comes from: the [sites] table resolved, hashed and mounted on the stock host, reread on a signal or a poll"
keywords = ["snapfire", "fsr", "micro-frontend", "artifact", "mount"]
categories = ["web-programming"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[features]
default = []
# `POST /__fsr/sites/reload` on the stock host, off unless the application asks.
reload_route = ["snapfire_fsr_host/sites_reload"]
# `HttpStore`, a store fetched over HTTP.
http = ["dep:ureq"]
# The `fsr-server` binary: the stock host for an application with no crate of its own, in production.
server = ["http", "snapfire_fsr_host/auth", "snapfire_fsr_host/oidc", "snapfire_fsr_host/passkey", "snapfire_fsr_host/tera", "snapfire_fsr_host/tls", "snapfire_fsr_host/grpc", "snapfire_fsr_host/graphql", "snapfire_fsr_host/http", "snapfire_fsr_host/share_cards", "tokio/rt-multi-thread", "tokio/net"]

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_host.workspace = true
flate2 = "1.1.10"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4.46"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt", "time", "signal", "macros", "net"] }
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ureq = { version = "3", optional = true }

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
snapfire_fsr_plan.workspace = true
bolero = "0.13"
proptest = "1"

[[bin]]
name = "fsr-server"
required-features = ["server"]

[[test]]
name = "server"
required-features = ["server"]
