[package]
name = "snapfire_fsr_plan"
version = "0.6.0"
description = "The plan file for SnapFire FSR: routes and their plans as a build artifact."
keywords = ["snapfire", "fsr", "routing", "manifest", "plan"]
categories = ["web-programming"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_ir.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
