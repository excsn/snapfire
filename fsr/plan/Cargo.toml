[package]
name = "snapfire_fsr_plan"
version = "0.20.1"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE"]
description = "The plan file for SnapFire FSR: routes and their plans as a build artifact."
keywords = ["snapfire", "fsr", "routing", "manifest", "plan"]
categories = ["web-programming"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
snapfire_fsr_core.workspace = true
snapfire_fsr_ir.workspace = true
thiserror = "2"

[dev-dependencies]
snapfire_fsr_ir = { workspace = true, features = ["intl_compiled"] }
proptest = "1"
