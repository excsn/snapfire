[profile.default]
fail-fast = false
slow-timeout = { period = "15s", terminate-after = 4 }
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"

[[profile.default.overrides]]
filter = "test(=every_example_builds_tests_and_boots_from_a_checkout)"
slow-timeout = { period = "60s", terminate-after = 10 }

# A test that needs the network passes with a SKIPPED line on stderr when it cannot reach it; nextest hides a passing test's output unless told otherwise.
[[profile.default.overrides]]
filter = "package(snapfire_fsr_cli) & (binary(=registry) | binary(=add_types) | binary(=props_checked))"
success-output = "immediate"
