[package]
name = "snapfire_fsr_ir"
version = "0.8.0"
description = "The lowered form of a loader or action body for SnapFire FSR, and the interpreter that runs it over the value model."
keywords = ["snapfire", "fsr", "interpreter", "typescript", "lowering"]
categories = ["web-programming", "compilers"]
exclude = ["tests"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
memchr = "2"
itoa = "1"
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
fixed_decimal = { version = "0.7", features = ["ryu"] }
futures-util = "0.3"
getrandom = "0.3"
icu_calendar = "2"
icu_datetime = "2"
icu_decimal = "2"
icu_experimental = "0.6"
icu_locale_core = "2"
icu_plurals = "2"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }
bolero = "0.13"
proptest = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
