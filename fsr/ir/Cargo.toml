[package]
name = "snapfire_fsr_ir"
version = "0.20.0"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md"]
description = "The lowered form of a loader or action body for SnapFire FSR, and the interpreter that runs it over the value model."
keywords = ["snapfire", "fsr", "interpreter", "typescript", "lowering"]
categories = ["web-programming", "compilers"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
memchr = "2"
itoa = "1"
libc = "0.2"
parking_lot = "0.13"
regress = { version = "0.12", default-features = false, features = ["std", "utf16"] }
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_i18n = { path = "../../i18n", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
form_urlencoded = "1"
url = "2"
fixed_decimal = { version = "0.7", features = ["ryu"] }
futures-util = "0.3"
getrandom = "0.3"
icu_calendar = "2"
icu_collator = "2"
icu_datetime = "2"
icu_decimal = "2"
icu_list = "2"
icu_locale_core = "2"
icu_plurals = "2"
indexmap = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
smol_str = "0.3"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
yaml-rust2 = "0.13"

[dev-dependencies]
snapfire_fsr_test_internal = { path = "../test_internal" }
arbitrary = { version = "1", features = ["derive"] }
bolero = "0.13"
proptest = "1"
parking_lot = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
