[package]
name = "snapfire_fsr_ir"
version = "0.22.0"
include = ["/src/**/*.rs", "/data/icu.postcard", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md", "/LICENSE"]
description = "The lowered form of a loader or action body for SnapFire FSR, and the interpreter that runs it over the value model."
keywords = ["snapfire", "fsr", "interpreter", "typescript", "lowering"]
categories = ["web-programming", "compilers"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[features]
# Where `Date`'s local time reads its zone rules, passed to snapfire_time. The
# host turns one on; a build with neither fails each local-time read by name.
tz_compiled = ["snapfire_time/tz_compiled"]
tz_system = ["snapfire_time/tz_system"]
# Every locale's data built into the crate, which `IntlData::current` falls
# back to when a program installs none. A host serving a built application
# installs the data its build wrote and leaves this off.
intl_compiled = ["snapfire_i18n/embedded", "snapfire_i18n/display_names"]

[dependencies]
memchr = "2"
itoa = "1"
libc = "0.2"
parking_lot = "0.13"
regress = { version = "0.12", default-features = false, features = ["std", "utf16"] }
snapfire_fsr_core.workspace = true
snapfire_fsr_runtime.workspace = true
snapfire_i18n = { path = "../../i18n", version = "0.2.0", default-features = false }
snapfire_time = { path = "../../time", version = "0.1.0", default-features = false }
form_urlencoded = "1"
url = "2"
fixed_decimal = { version = "0.7", features = ["ryu"] }
futures-util = "0.3"
getrandom = "0.3"
# ICU4X 2.3 carries CLDR 48, the data Chrome's ICU 78 ships. docs/guide/901-javascripts-built-ins.md says when to move.
icu_calendar = { version = "~2.3", default-features = false, features = ["serde"] }
icu_collator = { version = "~2.3", default-features = false, features = ["serde"] }
icu_datetime = { version = "~2.3", default-features = false, features = ["serde"] }
icu_decimal = { version = "~2.3", default-features = false, features = ["serde"] }
icu_list = { version = "~2.3", default-features = false, features = ["serde"] }
icu_locale_core = "~2.3"
icu_plurals = { version = "~2.3", default-features = false, features = ["serde"] }
icu_segmenter = { version = "~2.3", default-features = false, features = ["serde"] }
icu_locale = { version = "~2.3", default-features = false, features = ["serde"] }
icu_provider = { version = "~2.3", features = ["deserialize_postcard_1", "sync"] }
icu_provider_adapters = "~2.3"
icu_provider_blob = { version = "~2.3", features = ["alloc"] }
writeable = "0.6"
indexmap.workspace = true
serde_json.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.11"
smol_str = "0.3"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
yaml-rust2 = "0.13"

[dev-dependencies]
snapfire_fsr_ir = { path = ".", features = ["intl_compiled"] }
snapfire_time = { path = "../../time", version = "0.1.0", features = ["tz_compiled"] }
snapfire_fsr_test_internal = { path = "../test_internal" }
arbitrary = { version = "1", features = ["derive"] }
bolero = "0.13"
proptest = "1"
parking_lot = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
