[package]
name = "snapfire_fsr_migrate"
version = "0.2.2"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]
description = "Rewrites an application written for Next.js, SvelteKit, Nuxt or Ink into a SnapFire FSR application, naming each line it left for a person."
keywords = ["snapfire", "fsr", "migration", "codemod", "nextjs"]
categories = ["web-programming", "development-tools"]

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
oxc_str = "0.155"
oxc_syntax = "0.155"
schemars = "1"
snapfire_fsr_lower.workspace = true
snapfire_lint = { path = "../../lint", version = "0.1.0" }
snapfire_fsr_lint.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
