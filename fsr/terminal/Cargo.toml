[package]
name = "snapfire_fsr_terminal"
version = "0.2.1"
include = ["/src/**", "/Cargo.toml", "/README.md", "/README.USAGE.md", "/API_REFERENCE.md"]
description = "Ink's Box and Text laid out with flexbox and drawn to a terminal as cells."
keywords = ["snapfire", "fsr", "terminal", "tui", "ink"]
categories = ["command-line-interface"]
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
base64 = "0.23"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
unicode-width = "0.2"
