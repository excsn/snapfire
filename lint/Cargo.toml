[package]
name = "snapfire_lint"
version = "0.1.0"
description = "Lint TypeScript and JavaScript with ESLint's rules and ESLint's configuration shape. No NodeJS required."

keywords = ["lint", "eslint", "typescript", "javascript", "build-tools"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/excsn/snapfire"
homepage = "https://github.com/excsn/snapfire/tree/main/lint"
readme = "README.md"

edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
bitflags = "2.13"
convert_case = "0.10"
cow-utils = "0.1.3"
fast-glob = "1.1"
globset = "0.4"
ignore = "0.4"
indexmap = "2"
itertools = "0.15"
javascript-globals = "2"
lazy-regex = "3.6"
markdown = "1"
memchr = "2.8"
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_cfg = "0.155"
oxc_codegen = { version = "0.155", default-features = false }
oxc_diagnostics = "0.155"
oxc_ecmascript = { version = "0.155", features = ["side_effects"] }
oxc_index = "5"
oxc_parser = "0.155"
oxc_regular_expression = "0.155"
oxc_semantic = { version = "0.155", features = ["cfg", "linter"] }
oxc_span = "0.155"
oxc_str = { version = "0.155", features = ["serialize"] }
oxc_syntax = "0.155"
parking_lot = "0.12"
phf = { version = "0.14", features = ["macros"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
snapfire_compiler_wire = { path = "../compiler/wire", version = "0.5.0" }
tera = "2"
thiserror = "2"
toml = "0.8"
url = "2"

[dev-dependencies]
snapfire_svelte = { path = "../compiler/svelte" }
snapfire_vue = { path = "../compiler/vue" }
tempfile = "3"
